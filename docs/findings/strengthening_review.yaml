adversarial_checks:
  - issue: Literal code equality versus arithmetic provable equivalence.
    resolution: The original AgreeOnCone is preserved. Companion arithmetic theorems use mutual implication explicitly; the quotient equality bridge proves exactly that relation and asserts no effective quotient normal form.
  - issue: Weak Walsh branch might survive without actual strictness.
    resolution: The proof eliminates it at its true generator using true_consistent and the independent all-consistent-input strictness premise. A finite fixture explicitly inhabits the weak branch when strictness is absent.
  - issue: The guarded operator does not satisfy global uniform strictness.
    resolution: Its agreement is proved directly. It is never presented as an example of the globally strict Walsh class; the ordinary consistency operator witnesses nonemptiness of that class.
  - issue: Imported consistency must match the finite extension's proof presentation.
    resolution: The instance fixes Ax_(EA+phi)=Ax_EA or the numeral code(phi) and the corresponding standard proof predicate. Theorems are not applied to arbitrary formulas merely named consistency.
  - issue: Efficiency might be vacuous or encode universal classification.
    resolution: The declared domain contains F, C, and identity; yields distinguish identity from the other two. The ledger is invariant but generally undecidable. Its construction proves this example and supplies no global selection or computational optimization theorem.
  - issue: Finite fixtures might stand in for actual arithmetic.
    resolution: They verify algebraic mechanisms only. The arithmetic case has a separate ordinary mathematical proof and source-hypothesis mapping. Native EA syntax and source theorem proofs remain outside the mechanization claim.
  - issue: An elementary structural theorem might be oversold as new incompleteness.
    resolution: The switch budget and selection boundary are stated as structural companion results, without novelty or unconditional arithmetic-classification claims.
