    file: src/lean/ClosureFrontier/TheoremTrack/Dynamics.lean
    theorem: package_switch_budget
    exact_statement: For every schedule of idempotent maps, fixed initial input, and n, the count of changed-state transitions among steps 0 through n is at most 1 plus the count of map switches between steps 0 through n.
    hypotheses: The only state updates are the declared packageOrbit recurrence; each package map is idempotent.
    witness_theorem: orbit_change_requires_switch
    infinite_corollary: unbounded_changes_require_unbounded_switches
    arithmetic_order_assumptions: none
  - id: unbounded_growth_from_two_closures
    file: src/lean/ClosureFrontier/TheoremTrack/Dynamics.lean
    theorem: alternating_orbit_exact
    exact_statement: Alternating the two defined packages from zero gives x_t=t for every natural t.
    supporting_theorems:
      - odd_round_laws
      - even_round_laws
      - odd_round_computable
      - even_round_computable
      - alternating_orbit_unbounded
      - alternating_uses_two_packages
      - alternating_switches_every_step
      - alternating_budget_sharp
    map_laws: actual Computable, Monotone, inflationary, and idempotent
    sharpness: The bound is attained at every finite horizon.
    excluded_overread: Unbounded growth does not require infinitely many distinct package maps.
  - id: invariant_ledger_selection_boundary
    file: src/lean/ClosureFrontier/TheoremTrack/LedgerBoundary.lean
    theorem: universal_ledger_canonicality_iff_coverage
    exact_statement: Universal canonical efficient representation across all invariant real ledgers is equivalent to canonical coverage of the cone-equivalence classes of the comparison domain.
    hypotheses: Fixed domain, cone, and canonical family contained in the domain.
    counterexample_theorem: uncovered_class_has_counterledger
    separating_ledger: Yield 1 on an uncovered class, 0 elsewhere; constant zero cost.
    ledger_class: All set-theoretic real-valued invariant ledgers, including noncomputable ones.
    excluded_overread: Does not establish a computable-ledger version for undecidable cone equivalence; does not require the canonical family to equal the domain as a set.
