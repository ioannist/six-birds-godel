schema_id: pica_atlas_schema
version: 0.1.0
required_files:
  - data/pica_atlas/cell_atlas.yaml
  - data/pica_atlas/program_atlas.yaml
  - data/pica_atlas/concept_crosswalk.yaml
allowed_vocabularies:
  provenance_type:
    - ledger
    - figdata
    - code
    - ledger+figdata
    - figdata+code
    - ledger+code
  evidence_status:
    - observed
    - inferred
    - partial
  program_kind:
    - single_cell
    - row_group
    - key_ablation
    - baseline_style
    - configuration
  crosswalk_status:
    - direct
    - partial
    - none
