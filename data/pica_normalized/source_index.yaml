mapping_sources:
  ledger_surfaces: data/pica_mapping/ledger_surfaces.yaml
  figdata_surfaces: data/pica_mapping/figdata_surfaces.yaml
counts:
  ledger_records: 227
  figdata_records: 6
  source_rows: 10
surfaces:
  ledger:
  - id: ldg_hypotheses
    logical_name: hypotheses
    source_path: vendors/six-birds-pica/lab/ledger/hypotheses.jsonl
    file_type: jsonl
    records_parsed: true
    observed_fields:
    - amendment
    - claim
    - evidence
    - falsification_criterion
    - id
    - input_closures
    - primitives_used
    - proposed_experiment
    - result
    - status
    - tests_remaining
    - timestamp
    schema_note: hypothesis records include claim statement and falsification metadata.
  - id: ldg_experiments
    logical_name: experiments
    source_path: vendors/six-birds-pica/lab/ledger/experiments.jsonl
    file_type: jsonl
    records_parsed: true
    observed_fields:
    - amendment
    - artifacts
    - description
    - hypothesis_id
    - id
    - metrics
    - note
    - parameters
    - result
    - status
    - timestamp
    schema_note: experiment records tie parameters/metrics to hypothesis identifiers.
  - id: ldg_closures
    logical_name: closures
    source_path: vendors/six-birds-pica/lab/ledger/closures.jsonl
    file_type: jsonl
    records_parsed: true
    observed_fields:
    - amendment
    - amendment_type
    - amends
    - description
    - details
    - detection_method
    - epsilon
    - experiment_id
    - experiment_ids
    - finding
    - hypothesis_id
    - id
    - implication
    - key_finding
    - layer
    - note
    - persistence_threshold
    - primitives_involved
    - robustness_rate
    - stability_score
    - status
    - supporting_experiments
    - supporting_runs
    - timestamp
    - verdict
    schema_note: closure records include verdict and robustness indicators.
  - id: ldg_results
    logical_name: results
    source_path: vendors/six-birds-pica/lab/ledger/results.jsonl
    file_type: jsonl
    records_parsed: true
    observed_fields:
    - campaign_id
    - description
    - experiment_id
    - id
    - metrics
    - stage
    - status
    - timestamp
    schema_note: results records track campaign stage outputs and metrics.
  figdata:
  - id: fig_claim_map
    file_path: vendors/six-birds-pica/paper/figdata/claim_map.json
    format: json
    coarse_category: claim_map
    relevance: claims
  - id: fig_run_summary
    file_path: vendors/six-birds-pica/paper/figdata/run_summary_table.csv.gz
    format: csv.gz
    coarse_category: run_summary
    relevance: audits
  - id: fig_scan_rung
    file_path: vendors/six-birds-pica/paper/figdata/scan_rung_table.csv.gz
    format: csv.gz
    coarse_category: headline_metrics
    relevance: headline_metrics
  - id: fig_t6_robustness
    file_path: vendors/six-birds-pica/paper/figdata/T6_robustness.csv
    format: csv
    coarse_category: robustness
    relevance: audits
  - id: fig_f2_insets
    file_path: vendors/six-birds-pica/paper/figdata/F2_insets_enabled.json
    format: json
    coarse_category: cells
    relevance: cells
  - id: fig_loo_cell_map
    file_path: vendors/six-birds-pica/paper/figdata/loo_cell_map.csv
    format: csv
    coarse_category: ablation
    relevance: cells
