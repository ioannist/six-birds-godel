version: 0.1.0
analysis_id: ticket_p5_vendor_baseline
programs:
  supported_by_vendor: []
  unsupported_by_vendor: []
  not_assessable_from_shipped_data:
  - id: toy_baseline_weaker_than_richer_configs
    note: Baseline/full_action/full_all surfaces are present. Presence alone does
      not establish superiority; use quantitative program deltas.
    evidence_paths:
    - data/pica_atlas/program_atlas.yaml
    - data/pica_normalized/figdata_records.jsonl
  - id: toy_heterogeneous_cell_importance
    note: LOO and row/group coverage varies. Coverage counts are not cell effects;
      use the quantitative cell delta table.
    evidence_paths:
    - data/pica_atlas/program_atlas.yaml
    - results/ticket-p5/ablation_summary.csv
  - id: toy_interaction_structure_needed
    note: A robustness surface is present. Its presence proves neither interaction
      gain nor the inadequacy of a scalar proxy.
    evidence_paths:
    - data/pica_normalized/figdata_records.jsonl
  - id: toy_broad_uniqueness_stability_claims
    note: Toy falsification exists, but direct vendor-side uniqueness/stability equivalence
      is not directly testable from shipped normalized subset.
    evidence_paths: &id001
    - results/ticket-05/report.md
    - results/ticket-06/report.md
    - results/ticket-06-1/report.md
    - results/ticket-06-2/report.md
    - results/ticket-06-3/report.md
    - results/ticket-06-4/report.md
notes:
  guardrail: Conservative support/provenance audit only; no effect-size claim promotion.
  toy_report_inputs: *id001
  ranking_method: Cell ranking uses explicit LOO+row-group coverage proxy, not claimed
    causal effect size.
